<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    sfmap — el logo.

    LA REGLA: el icono ES lo que la app hace. No una metafora, no una inicial.
    Tres nodos unidos por codos ortogonales es literalmente la gramatica que el
    compilador dibuja: cajas y aristas con angulos rectos. Quien lo ve una vez
    sabe que hay dentro.

    La familia: teja casi negra con esquina ~22%, glifo de TRAZO con bloom de
    neon propio, y el par de marca — morado #8C27F1 en los nodos, oro #ff9101
    en las aristas. El morado es la materia, el oro es la relacion: la misma
    reparticion que usa el lienzo.

    Legible a 32px porque solo hay tres formas y los trazos son gruesos. Un
    icono con seis nodos se vuelve una mancha en el Dock.
  -->
  <defs>
    <linearGradient id="teja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17151f"/>
      <stop offset="1" stop-color="#0a0910"/>
    </linearGradient>
    <filter id="bloomMorado" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bloomOro" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#teja)"/>
  <rect x="4" y="4" width="1016" height="1016" rx="226" ry="226"
        fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="8"/>

  <!-- LAS ARISTAS van DEBAJO de los nodos, igual que en el lienzo: una flecha
       por encima de una tarjeta se lee como error aunque la geometria este bien. -->
  <g filter="url(#bloomOro)" fill="none" stroke="#ff9101"
     stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M356 336 H512 V520"/>
    <path d="M668 336 H512"/>
    <path d="M512 520 V688"/>
  </g>

  <g filter="url(#bloomMorado)">
    <!-- dos nodos arriba, uno abajo: la L que hace cualquier diagrama real -->
    <rect x="196" y="252" width="220" height="168" rx="44"
          fill="#0a0910" stroke="#8C27F1" stroke-width="30"/>
    <rect x="608" y="252" width="220" height="168" rx="44"
          fill="#0a0910" stroke="#a95cff" stroke-width="30"/>
    <rect x="380" y="688" width="264" height="180" rx="48"
          fill="#0a0910" stroke="#8C27F1" stroke-width="30"/>
  </g>

  <!-- La punta de flecha: la direccion es informacion, no adorno. -->
  <path d="M512 688 L474 622 H550 Z" fill="#ff9101" filter="url(#bloomOro)"/>
</svg>
